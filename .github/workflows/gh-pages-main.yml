# This workflow will generate the static page under `master` subdirectory inside the `gh-pages` branch

# This workflow will run every time new changes were pushed to the `master` branch

name: App build CI/CD to master branch
permissions:
  contents: write

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: latest


      - name: Install dependencies
        run: npm install

      - name: Create build files for gh-pages deploy
        run: npm run ghpages:build

      # Reference: https://github.com/JamesIves/github-pages-deploy-action
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: ghpages
          clean-exclude: pr/
          force: false
          target-folder: master
